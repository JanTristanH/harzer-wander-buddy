name: Static website Expo build

on:
  pull_request:
    paths: ['app/**', 'scripts/build-static-website.mjs', 'scripts/measure-web-bundle.mjs', 'scripts/tests/**', '.github/workflows/static-website.yml']
  push:
    branches: [develop, main]
    paths: ['app/**', 'scripts/build-static-website.mjs', 'scripts/measure-web-bundle.mjs', 'scripts/tests/**', '.github/workflows/static-website.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-expo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: node --test scripts/tests/measure-web-bundle.test.mjs
      - run: node scripts/build-static-website.mjs /tmp/expo-static-website
      - uses: actions/upload-artifact@v5
        with:
          name: real-expo-static-website
          path: /tmp/expo-static-website
          retention-days: 7
