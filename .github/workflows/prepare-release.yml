name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release-develop
  cancel-in-progress: false

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != refs/heads/develop ]; then
            echo '::error::Run Prepare Release with branch develop.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main to be integrated
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo '::error::Merge main back into develop before preparing the next release.'
            exit 1
          fi

  tests:
    needs: check-branch
    uses: ./.github/workflows/tests.yml

  prepare:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Set RELEASE_PLEASE_TOKEN so preparation PRs trigger required CI checks.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
