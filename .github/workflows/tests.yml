name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  app-tests:
    name: App Jest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Run app tests
        run: npm test -- --runInBand --config jest.config.js
        working-directory: app

  backend-tests:
    name: Backend CAP tests
    runs-on: ubuntu-latest
    env:
      SECRET: ci-test-secret-at-least-32-characters
      BASE_URL: http://localhost:4004
      CLIENT_ID: ci-test-client
      ISSUER_BASE_URL: https://example.eu.auth0.com
      AUDIENCE: https://ci.harzer-wander-buddy.test/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/hwb/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend/hwb

      - name: Run backend tests
        run: npm test
        working-directory: backend/hwb
