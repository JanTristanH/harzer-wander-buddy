name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  app-tests:
    name: App Jest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Run app tests
        run: npm test -- --runInBand --config jest.config.js
        working-directory: app

  backend-tests:
    name: Backend CAP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/hwb/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend/hwb

      - name: Run backend tests
        run: npm test
        working-directory: backend/hwb
