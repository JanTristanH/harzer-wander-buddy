name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_call:
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Match Google's existing main trigger: no build args, no image push.
      - name: Build deployment image with defaults
        run: docker build --tag harzer-wander-buddy:ci .
      - name: Check minimal runtime and native image processing
        run: |
          docker run --rm harzer-wander-buddy:ci node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            assert.equal(process.getuid(), 65532);
            for (const path of ["/bin/sh", "node_modules/@sap/cds-dk", "node_modules/sqlite3"]) {
              assert.equal(fs.existsSync(path), false, path);
            }
            assert.ok(fs.existsSync("srv/csn.json"));
            assert.ok(fs.existsSync("app/rnweb/index.html"));
            require("sharp")({create: {width: 2, height: 2, channels: 3, background: "red"}})
              .webp().toBuffer().then(buffer => assert.ok(buffer.length > 0))
              .catch(error => { console.error(error); process.exitCode = 1; });
          '
      - name: Verify production startup with PostgreSQL
        run: |
          docker pull postgres:16-alpine
          python3 backend/hwb/benchmark/startup.py harzer-wander-buddy:ci --runs 1

  release-tests:
    name: Release automation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.cjs

  app-tests:
    name: App Jest tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Run app tests
        run: npm test -- --runInBand --config jest.config.js
        working-directory: app

      - name: Verify OTA runtime compatibility across releases
        run: node --test scripts/fingerprint.test.cjs
        working-directory: app

  backend-tests:
    name: Backend CAP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/hwb/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend/hwb

      - name: Run backend tests
        run: npm test
        working-directory: backend/hwb
