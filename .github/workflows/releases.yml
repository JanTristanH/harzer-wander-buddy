name: Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: releases-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      app_released: ${{ steps.release.outputs['app--release_created'] }}
      app_sha: ${{ steps.release.outputs['app--sha'] }}
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Set RELEASE_PLEASE_TOKEN so generated release PRs trigger required CI checks. See docs/releases.md.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  production-app:
    needs: release
    if: needs.release.outputs.app_released == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.app_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue production binaries
        run: eas build --platform all --profile production --non-interactive --no-wait
