name: Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: releases-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    outputs:
      app_released: ${{ steps.release.outputs.app_released }}
      app_sha: ${{ steps.release.outputs.app_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish prepared versions without changing main
        uses: actions/github-script@v7
        id: release
        with:
          script: |
            const { loadPlan, publish } = require('./scripts/publish-prepared-releases.cjs');
            await publish(loadPlan(), { github, context, core });

  production-app:
    needs: release
    if: needs.release.outputs.app_released == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.app_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue production binaries
        run: eas build --platform all --profile production --non-interactive --no-wait
