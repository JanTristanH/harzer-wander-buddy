name: Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: releases-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish prepared versions without changing main
        uses: actions/github-script@v7
        id: release
        with:
          script: |
            const { loadPlan, publish } = require('./scripts/publish-prepared-releases.cjs');
            await publish(loadPlan(), { github, context, core });

  backmerge-pr:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Set RELEASE_PLEASE_TOKEN so the backmerge PR triggers required CI checks.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Prepare main to develop PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const { prepareBackmerge } = require('./scripts/prepare-backmerge-pr.cjs');
            await prepareBackmerge({ github, context, core });
